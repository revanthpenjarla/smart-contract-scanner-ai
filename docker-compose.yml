version: '3.8'

services:
  # 1. Local AI Model (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: scanner_ollama
    ports:
      - "11435:11434"
    volumes:
      - ~/.ollama:/root/.ollama

  # 2. FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: scanner_backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 3. React Frontend (Vite + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: scanner_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
